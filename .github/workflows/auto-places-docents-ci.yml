name: AUTO places docents regression CI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-places-docents.yml'
      - '.github/workflows/auto-places-docents-ci.yml'
      - 'auto-places-docents/*.py'
      - 'auto-places-docents/tests/**'
      - 'auto-places-docents/requirements.txt'
      - 'controller-v2/**'
  pull_request:
    branches: [main]
    paths:
      - 'controller-v2/**'
      - '.github/workflows/auto-places-docents-ci.yml'
      - '.github/workflows/auto-places-docents.yml'
      - 'auto-places-docents/schedule_gate.py'
      - 'auto-places-docents/slot_ledger.py'
      - 'auto-places-docents/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r auto-places-docents/requirements.txt
      - name: Syntax and offline regressions
        run: |
          python -m compileall -q auto-places-docents
          python -m unittest discover -s auto-places-docents/tests -p 'test_*.py' -v

      - name: Node.js for V2 controller tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test independent scheduler, backup and failure safety
        run: node --test controller-v2/tests/*.test.mjs
