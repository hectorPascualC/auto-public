name: AUTO PUBLIC V2 - production Cloudflare diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-controller-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check live Cloudflare configuration without writing
        shell: python
        run: |
          import json, os, sys, urllib.request, urllib.error
          token=os.getenv("CF_TOKEN","")
          account=os.getenv("CF_ACCOUNT","")
          if not token or not account:
              print("BLOCKED: Cloudflare credentials missing")
              sys.exit(1)
          base=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/auto-public-controller-v2"
          def query(path):
              req=urllib.request.Request(base+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as res: return json.load(res)
              except urllib.error.HTTPError as e:
                  print(f"BLOCKED: Cloudflare API {path or '/'} HTTP {e.code}")
                  return None
          settings=query("/settings")
          schedules=query("/schedules")
          report={"worker":"auto-public-controller-v2","settings_accessible":settings is not None,
                  "schedules_accessible":schedules is not None}
          if isinstance(settings,dict) and settings.get("success"):
              bindings=settings.get("result",{}).get("bindings",[])
              report["dispatch_enabled"]=next((b.get("text") for b in bindings
                  if b.get("name")=="DISPATCH_ENABLED" and b.get("type")=="plain_text"),"NOT_FOUND")
              report["has_slot_coordinator"]=any(b.get("name")=="SLOT_COORDINATOR" for b in bindings)
              report["has_github_token_secret"]=any(b.get("name")=="GITHUB_TOKEN" and b.get("type")=="secret_text" for b in bindings)
          if isinstance(schedules,dict) and schedules.get("success"):
              report["crons"]=[x.get("cron") for x in schedules.get("result",{}).get("schedules",[])] if isinstance(schedules.get("result"),dict) else [x.get("cron") for x in schedules.get("result",[])]
          print("Cloudflare production evidence (redacted):")
          print(json.dumps(report,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Cloudflare production diagnosis\n\n```json\n"+json.dumps(report,indent=2)+"\n```\n")
          if report.get("dispatch_enabled")!="true" or not report.get("has_slot_coordinator") or not report.get("has_github_token_secret") or not report.get("crons"):
              sys.exit(1)
