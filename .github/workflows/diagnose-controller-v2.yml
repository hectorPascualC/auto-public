name: AUTO PUBLIC V2 - production Cloudflare diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-controller-v2.yml'
      - 'controller-v2/diagnose_runtime.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      V2_GITHUB_DISPATCH_TOKEN: ${{ secrets.V2_GITHUB_DISPATCH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic syntax
        run: python3 -m py_compile controller-v2/diagnose_runtime.py
      - name: Inspect real cron events and GitHub permissions without writes
        run: python3 controller-v2/diagnose_runtime.py
      - name: Upload redacted runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-v2-runtime-diagnosis
          path: controller-v2-runtime-diagnosis.json
          if-no-files-found: warn
          retention-days: 7
