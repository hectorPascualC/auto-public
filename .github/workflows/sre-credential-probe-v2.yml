name: AUTO PUBLIC V2 - dispatch authorization probe
# Safe probe: run_monitor=false forces gate to skip; never scans or claims a slot.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sre-credential-probe-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DISPATCH_TOKEN: ${{ secrets.V2_GITHUB_DISPATCH_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only Cloudflare GraphQL analytics (alternative to logs)
        shell: python
        run: |
          import datetime as dt, json, os, urllib.request, urllib.error
          token=os.getenv('CF_TOKEN','')
          account=os.getenv('CF_ACCOUNT','')
          if not token or not account:
              print('CLOUDFLARE_ANALYTICS=BLOCKED missing_credentials')
          else:
              query='''query($a: string, $s: string, $start: Time!, $end: Time!){
                viewer { accounts(filter:{accountTag:$a}) {
                  workersInvocationsAdaptive(limit:100,
                    filter:{scriptName:$s,datetime_geq:$start,datetime_leq:$end}) {
                    dimensions { datetime status }
                    sum { requests errors subrequests }
                  }
                } }
              }'''
              start='2026-10-23T06:20:00Z'
              end=dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              data=json.dumps({'query':query,'variables':{'a':account,
                's':'auto-public-controller-v2','start':start,'end':end}}).encode()
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',
                data=data,method='POST',headers={'Authorization':'Bearer '+token,
                'Content-Type':'application/json','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as f: payload=json.load(f)
                  if payload.get('errors'):
                      print('CLOUDFLARE_ANALYTICS=BLOCKED graphql_errors_'+str(len(payload['errors'])))
                  else:
                      records=payload.get('data',{}).get('viewer',{}).get('accounts',[])
                      entries=[x for a in records for x in a.get('workersInvocationsAdaptive',[])]
                      safe=[{'datetime':v.get('dimensions',{}).get('datetime'),
                        'status':v.get('dimensions',{}).get('status'),
                        'requests':v.get('sum',{}).get('requests'),
                        'errors':v.get('sum',{}).get('errors')} for v in entries[:30]]
                      print('CLOUDFLARE_ANALYTICS='+('PASS' if safe else 'NO_EVENTS'))
                      print(json.dumps(safe))
              except urllib.error.HTTPError as e:
                  print('CLOUDFLARE_ANALYTICS=BLOCKED http_'+str(e.code))
              except (urllib.error.URLError, ValueError, TimeoutError):
                  print('CLOUDFLARE_ANALYTICS=BLOCKED network_or_schema')
      - name: Test exact Worker dispatch credential on harmless skipped GitHub workflow
        shell: python
        run: |
          import json, os, sys, urllib.request, urllib.error
          token=os.getenv('DISPATCH_TOKEN','')
          if not token:
              print('DISPATCH_POST=BLOCKED missing_token')
              sys.exit(1)
          # run_monitor=false guarantees no scan, independent of any slot identity.
          data={'ref':'main','inputs':{'run_monitor':'false','force_run':'false',
                'slot_local':'','trigger_attempt':'primary'}}
          req=urllib.request.Request(
            'https://api.github.com/repos/hectorPascualC/auto-public/actions/workflows/auto-places-docents.yml/dispatches',
            data=json.dumps(data).encode(),method='POST',
            headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                     'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',
                     'User-Agent':'auto-public-v2-safe-preflight'})
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  code=response.status
          except urllib.error.HTTPError as e:
              code=e.code
          except (urllib.error.URLError,TimeoutError):
              code=0
          print('DISPATCH_POST='+('PASS' if code==204 else 'FAIL')+' HTTP '+str(code))
          if code!=204: sys.exit(1)
