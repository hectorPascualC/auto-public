name: V2 Cloudflare safe tail - one time
# Bounded Friday 2026-10-23 evening, weekend and Monday read-only capture.
# All times UTC; Cron weekday semantics here are GITHUB (0=Sun, 1=Mon).
# In contrast, Cloudflare weekdays are 1=Sun, 2=Mon, ... 7=Sat.
# Date guard prevents later weeks from running. Friday push opens a two-hour live tail.
# GitHub may drop schedules at minute 0 under high load; schedule once at :13
# to reduce contention. Saturday hourly captures are date-guarded and
# stop before the next hour; never overlap with the first two-hour capture.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-cloudflare-safe-tail.yml']
  schedule:
    - cron: '13 6 * * 1'
    - cron: '13 6 * * 6,0'
    # Saturday 24 OCT only: bounded hourly tail 12:26..22:26 Madrid.
    # Begins after the existing 10:16-12:21 long capture has ended.
    - cron: '26 10-20 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auto-public-v2-hourly-tail
  cancel-in-progress: false
jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 142
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate one-date diagnostic window
        id: window
        shell: bash
        env:
          EVENT_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, os
          now=dt.datetime.now(dt.timezone.utc)
          dates={dt.date(2026,10,24),dt.date(2026,10,25),dt.date(2026,10,26)}
          cutoff=dt.datetime.combine(now.date(),dt.time(8,0),tzinfo=dt.timezone.utc)
          today_is_safe_friday=(now.date()==dt.date(2026,10,23) and
             dt.time(19,0) <= now.time() < dt.time(21,30) and
             os.getenv("GITHUB_EVENT_NAME")=="push")
          today_is_manual_saturday=(now.date()==dt.date(2026,10,24) and
             dt.time(8,0) <= now.time() < dt.time(10,45) and
             os.getenv("GITHUB_EVENT_NAME")=="workflow_dispatch")
          # One bounded manual capture to diagnose the confirmed DO exception
          # after today's hotfix. Existing GitHub cron missed its 10:26 UTC
          # observation; reuse the SAME concurrency group, no parallel tail.
          manual_short=(now.date()==dt.date(2026,10,24) and
             dt.time(10,35) <= now.time() < dt.time(10,45) and
             os.getenv("GITHUB_EVENT_NAME") in ("workflow_dispatch","push"))
          hourly_saturday=(now.date()==dt.date(2026,10,24) and
             os.getenv("GITHUB_EVENT_NAME")=="schedule" and
             os.getenv("EVENT_CRON")=="26 10-20 * * 6" and
             10 <= now.hour <= 20 and 26 <= now.minute <= 52)
          enabled=(manual_short or hourly_saturday or today_is_manual_saturday or today_is_safe_friday or
             (now.date() in dates and now < cutoff and
              os.getenv("GITHUB_EVENT_NAME") in ("workflow_dispatch","schedule")))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("enabled="+str(enabled).lower()+"\n")
              out.write("capture_mode="+("short" if manual_short else "hourly" if hourly_saturday else "long")+"\n")
          print("TAIL_WINDOW="+("ACTIVE" if enabled else "SKIPPED_late_or_other_day"))
          PY
      - name: Validate Cloudflare credentials are present
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare tail credentials missing"
            exit 1
          fi
      - name: Read Cloudflare events with strict log redaction
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          set -uo pipefail
          # Shared filter always emits a zero-frame summary, even on no frames.
          # Hourly tail stops before the next capture; original long window stays intact.
          case '${{ steps.window.outputs.capture_mode }}' in
            short) capture_seconds=1080 ;; # 18m, catches the :47 backup
            hourly) capture_seconds=3240 ;;
            long) capture_seconds=7500 ;;
            *) echo '::error::Invalid capture mode'; exit 1 ;;
          esac
          set +e
          timeout -s INT "$capture_seconds" npx --yes wrangler@4.139.0 tail auto-public-controller-v2 --format=json --config controller-v2/wrangler.toml 2>/tmp/v2-tail-stderr.txt | python3 -u controller-v2/safe_tail_filter.py | tee v2-safe-traces.jsonl
          codes=( "${PIPESTATUS[@]}" )
          set -e
          if [[ "${codes[0]}" != "0" && "${codes[0]}" != "124" ]]; then
            echo "::error::Cloudflare tail connection failed; inspect permissions via Dashboard (raw error withheld)"
            exit 1
          fi
          # pipefail is deliberately suspended above to capture all PIPESTATUS
          # entries. Never claim PASS if the sanitizer or tee failed even when
          # Wrangler exited 0: the evidence would be missing or incomplete.
          if [[ "${codes[1]}" != "0" || "${codes[2]}" != "0" ]]; then
            echo "::error::Cloudflare tail redaction or evidence capture failed; no raw output will be published"
            exit 1
          fi
          echo "Tail session finished. Redacted observations and explicit capture summary written."
      - name: Upload sanitized event evidence
        if: always() && steps.window.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-v2-safe-tail-${{ github.run_id }}
          path: v2-safe-traces.jsonl
          if-no-files-found: warn
          retention-days: 2
