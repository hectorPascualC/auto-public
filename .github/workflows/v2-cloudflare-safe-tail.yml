name: V2 Cloudflare safe tail - one time
# Bounded 2026-10-24/25 weekend and Monday 2026-10-26 read-only capture.
# All times UTC; Cron weekday semantics here are GITHUB (0=Sun, 1=Mon).
# In contrast, Cloudflare weekdays are 1=Sun, 2=Mon, ... 7=Sat.
# Date guard prevents later weeks from running.
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * 6,0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 142
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate one-date diagnostic window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, os
          now=dt.datetime.now(dt.timezone.utc)
          dates={dt.date(2026,10,24),dt.date(2026,10,25),dt.date(2026,10,26)}
          cutoff=dt.datetime.combine(now.date(),dt.time(7,25),tzinfo=dt.timezone.utc)
          enabled=(now.date() in dates and now < cutoff and
                   os.getenv("GITHUB_EVENT_NAME") in ("workflow_dispatch","schedule"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("enabled="+str(enabled).lower()+"\n")
          print("TAIL_WINDOW="+("ACTIVE" if enabled else "SKIPPED_late_or_other_day"))
          PY
      - name: Validate Cloudflare credentials are present
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare tail credentials missing"
            exit 1
          fi
      - name: Read Cloudflare events with strict log redaction
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          set -uo pipefail
          # Shared filter has regression tests and always emits a zero-frame summary.
          set +e
          timeout -s INT 7500 npx --yes wrangler@4.139.0 tail auto-public-controller-v2 --format=json --config controller-v2/wrangler.toml 2>/tmp/v2-tail-stderr.txt | python3 -u controller-v2/safe_tail_filter.py | tee v2-safe-traces.jsonl
          codes=( "${PIPESTATUS[@]}" )
          set -e
          if [[ "${codes[0]}" != "0" && "${codes[0]}" != "124" ]]; then
            echo "::error::Cloudflare tail connection failed; inspect permissions via Dashboard (raw error withheld)"
            exit 1
          fi
          echo "Tail session finished. Redacted observations and explicit capture summary written."
      - name: Upload sanitized event evidence
        if: always() && steps.window.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-v2-safe-tail-${{ github.run_id }}
          path: v2-safe-traces.jsonl
          if-no-files-found: warn
          retention-days: 2
