name: V2 credential preflight - one-time
# One-time production diagnostic; delete after testing. NEVER disclose credentials.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-credential-preflight.yml']
permissions:
  contents: read
jobs:
  verify-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DISPATCH_TOKEN: ${{ secrets.V2_GITHUB_DISPATCH_TOKEN }}
    steps:
      - name: Validate required secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN:-}" ]]; then
            echo "::error::V2_GITHUB_DISPATCH_TOKEN is missing (not printing secret)"
            exit 1
          fi
      - name: Validate GitHub read and no-scan dispatch permissions
        shell: bash
        run: |
          set -euo pipefail
          URL="https://api.github.com/repos/hectorPascualC/auto-public"
          GH_HDR=(-H "Authorization: Bearer ${DISPATCH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: auto-public-v2-preflight")
          get_status() {
            curl --max-time 15 --retry 0 --silent --show-error --output /dev/null --write-out '%{http_code}' "${GH_HDR[@]}" "$1"
          }
          contents="$(get_status "$URL/contents/auto-places-docents/state/health.json?ref=main")"
          runs="$(get_status "$URL/actions/runs?event=workflow_dispatch&per_page=1")"
          echo "V2 GitHub contents read HTTP $contents; actions read HTTP $runs"
          [[ "$contents" == "200" && "$runs" == "200" ]] || {
            echo "::error::Token missing GitHub Contents:read or Actions:read; no dispatch attempted"
            exit 1
          }
          # Explicitly DISABLE the actual monitor. This only exercises Actions:write
          # and creates a skipped workflow run with no scan and no state write.
          payload='{"ref":"main","inputs":{"run_monitor":"false","force_run":"false","slot_local":"","trigger_attempt":"primary"}}'
          status="$(curl --max-time 20 --retry 0 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "${GH_HDR[@]}" -H "Content-Type: application/json" --data "$payload" \
            "$URL/actions/workflows/auto-places-docents.yml/dispatches")"
          echo "V2 no-scan workflow_dispatch HTTP $status"
          [[ "$status" == "204" || "$status" == "200" ]] || {
            echo "::error::GitHub workflow_dispatch denied; no source scan triggered"
            exit 1
          }
          echo "V2 TOKEN PREFLIGHT PASS: read and Actions dispatch permissions verified"
