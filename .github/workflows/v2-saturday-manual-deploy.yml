name: AUTO PUBLIC V2 - Saturday 24 one-time live deployment
# Manual-only explicit approval. Preserves existing registered Cloudflare crons.
on:
  workflow_dispatch:
    inputs:
      confirm_saturday:
        description: 'Type ENABLE_SATURDAY_24 to deploy date-guarded Worker'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: auto-public-v2-saturday-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify explicit human confirmation
        env:
          CONFIRM: ${{ inputs.confirm_saturday }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "ENABLE_SATURDAY_24"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline controller regressions
        run: |
          python3 -m py_compile controller-v2/saturday_deploy_guard.py auto-places-docents/schedule_gate.py
          python3 -m unittest discover -s controller-v2/tests -p 'test_saturday_deploy_guard.py' -v
          node --test controller-v2/tests/*.test.mjs
      - name: Cloudflare read-only preflight and temporary config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 controller-v2/saturday_deploy_guard.py preflight
      - name: Verify temporary Wrangler bundle
        run: npx --yes wrangler@4.139.0 deploy --dry-run --config controller-v2/wrangler.saturday-runtime.toml
      - name: Publish one-day Worker without touching Cloudflare triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.139.0 deploy --config controller-v2/wrangler.saturday-runtime.toml --keep-vars
      - name: Cloudflare cron and bindings readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 controller-v2/saturday_deploy_guard.py postflight
