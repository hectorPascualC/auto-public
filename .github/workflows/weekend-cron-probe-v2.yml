name: AUTO PUBLIC V2 - temporary weekend cron probe
# Finite calendar-scoped Cloudflare change. Never modifies Worker source,
# secrets, GitHub monitor, Durable Objects, or production weekday schedule.
# Friday late-night and weekend invocations are IGNORED by the Worker.
# Friday extra trigger is removed on the first Saturday verification; the
# weekend trigger is removed on Monday with guarded redundant attempts.
# 2026-10-24 Saturday 00:25 UTC: guarded one-time push recovery requested
# after 00:05 UTC schedule was absent from recent runs; no change to behavior.
# The existing date gate, Cloudflare allowlist, GET/PUT/GET, and concurrency
# are mandatory; if a scheduled cleanup wins the race, this run is idempotent.
# If GitHub scheduled runs are delayed, an SRE-reviewed push changing ONLY this
# workflow path can trigger the same date-gated Saturday/Sunday/Monday guard.
# 2026-10-24: authorized Sunday E2E continuation; push triggers exactly one
# guarded verify/readback and migrates the known weekend 6-20 UTC to 6-21 UTC.
# Production weekday cron, secrets, dispatch logic and Monday cleanup stay intact.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: auto-public-v2-weekend-cron-recovery
  cancel-in-progress: false
jobs:
  temporary-cron:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate Python syntax and weekend recovery tests
        run: |
          python3 -m py_compile controller-v2/weekend_cron_guard.py
          python3 -m unittest discover -s controller-v2/tests -p 'test_weekend_cron_guard.py' -v
      - name: Gate deployed controller contract against existing tests
        run: node --test controller-v2/tests/*.test.mjs
      - name: Apply only guarded temporary schedule or Monday restoration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 controller-v2/weekend_cron_guard.py
