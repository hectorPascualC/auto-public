name = "auto-public-controller-v2"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
GITHUB_REPO = "hectorPascualC/auto-public"
DISPATCH_ENABLED = "false"
# GitHub native owns production weekday scans; Cloudflare must NOT duplicate.
WEEKDAY_SCHEDULER = "github"

# Preserve production logs/traces across GitHub-driven Wrangler redeployments.
# Few cron invocations per day: 100% sampling is inexpensive and diagnostic.
[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[triggers]
# UTC; the Worker filters the actual Madrid slot and CET/CEST at runtime.
# Cloudflare weekdays 1=Sun, 2=Mon, ..., 6=Fri, 7=Sat (unlike GitHub).\n# MON-FRI = 2-6. Ordinary UTC candidates; Madrid slot gating handles CET/CEST.
crons = ["35,47 6,7,8,9,11,12,13,14 * * 2-6"]

[[durable_objects.bindings]]
name = "SLOT_COORDINATOR"
class_name = "SlotCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SlotCoordinator"]
