name = "auto-public-controller-v2"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
GITHUB_REPO = "hectorPascualC/auto-public"
DISPATCH_ENABLED = "false"

# Preserve production logs/traces across GitHub-driven Wrangler redeployments.
# Few cron invocations per day: 100% sampling is inexpensive and diagnostic.
[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[triggers]
# UTC; the Worker filters the actual Madrid slot and CET/CEST at runtime.
# Temporary test crons; code only accepts 2026-10-22.
crons = ["35,47 6,7,8,9,11,12,13,14 * * 1-5", "50 16 * * 1-5", "10 17 * * 1-5"]

[[durable_objects.bindings]]
name = "SLOT_COORDINATOR"
class_name = "SlotCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SlotCoordinator"]
